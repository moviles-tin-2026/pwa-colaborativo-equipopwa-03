<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Temperatura PWA</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0078d4">
</head>
<body>
    <div class="container">
        <h1>Convertidor de Temperatura</h1>
        
        <div class="input-group">
            <label for="temperature">Temperatura:</label>
            <input type="number" id="temperature" value="22">
        </div>
        
        <div class="input-group">
            <label for="from-unit">De:</label>
            <select id="from-unit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="to-unit">A:</label>
            <select id="to-unit">
                <option value="F">Fahrenheit (°F)</option>
                <option value="C">Celsius (°C)</option>
                <option value="K">Kelvin (K)</option>
            </select>
        </div>

        <div class="result">
            <span id="result-value">71.6</span> <span id="result-unit">°F</span>
        </div>
    </div>

    <script src="js/converter.js"></script>
    <script>
        // Registro del Service Worker para habilitar las capacidades PWA e instalación
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito', reg))
                    .catch(err => console.log('Error al registrar el Service Worker', err));
            });
        }
    </script>
</body>
</html>
